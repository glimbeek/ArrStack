networks:
  internal_media:
    external: true
    name: internal_media

# --- Common settings ---
x-lsiodefaults: &lsio-defaults # Reusable template
  restart: unless-stopped
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TIMEZONE}
  networks:
         - internal_media

services:
  # --- Home Automation ---
  domoticz:
    <<: *lsio-defaults # Use the reusable template
    image: domoticz/domoticz:${DOMOTICZ_VERSION}
    container_name: domoticz
    restart: unless-stopped
    ports:
      - "8081:8080" # Mapping to 8081 so it doesn't clash with Pi-hole/Jellyfin
    volumes:
      - ./config/domoticz:/opt/domoticz/userdata
    environment:
      - TZ=${TIMEZONE}
      - PUID=${PUID}
      - PGID=${PGID}
    #devices:
      # P1 slimme meter kabel. by-id i.p.v. ttyUSB0: dat nummer kan na een
      # reboot wisselen, by-id blijft altijd naar dezelfde dongle wijzen.
      #- "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AC2FKZAZ-if00-port0:/dev/ttyUSB0"

  # --- Home Assistant ---
  # Bewust GEEN *lsio-defaults: dat anchor zet networks: internal_media, en dat
  # kan niet samen met network_mode: host. Het HA-image is bovendien geen
  # linuxserver-image, dus PUID/PGID doen daar niets.
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:${HOMEASSISTANT_VERSION:-stable}
    restart: unless-stopped
    # Nodig voor mDNS/SSDP discovery (HomeWizard, ESPHome, Cast).
    # Discovery werkt niet over een Docker bridge network.
    network_mode: host
    privileged: false          # true alleen nodig bij USB-doorgifte
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ./config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    #  - /run/dbus:/run/dbus:ro   # alleen bij Bluetooth-gebruik
    devices:
      - "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AC2FKZAZ-if00-port0:/dev/ttyUSB0"

  # --- MQTT broker ---
  # HA draait op host-network en bereikt deze dus via 127.0.0.1:1883
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2}
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/config:/mosquitto/config
      - ./config/mosquitto/data:/mosquitto/data
      - ./config/mosquitto/log:/mosquitto/log
    networks:
      - internal_media

  # --- Photo and Video Management ---
  immich-server:
    <<: *lsio-defaults # Use the reusable template, ignores PUID/PGID
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    devices:
      - /dev/dri:/dev/dri  # CRITICAL: This enables hardware acceleration for the CPU
    group_add:
      - 44
      - 992
    volumes:
      - ${MEDIA_DIR}/Photos/Immich:/usr/src/app/upload
      - ${MEDIA_DIR}/Photos/other:/mnt/external_photos
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    # condition: service_healthy i.p.v. een kale lijst. Zonder dat wacht compose
    # alleen tot de container bestaat, niet tot Postgres klaar is om te praten,
    # en crasht immich-server na een reboot willekeurig.
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  immich-machine-learning:
    <<: *lsio-defaults # Use the reusable template
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - ./config/immich/model-cache:/cache
    env_file:
      - .env

  redis:
    <<: *lsio-defaults # Use the reusable template
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411

  database:
    <<: *lsio-defaults # Use the reusable template
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      # LET OP: geen inline commentaar achter deze waarden. Docker Compose knipt
      # dat er wel af, maar shell-scripts die .env parsen niet — daar liep het
      # backupscript op stuk ("role postgres # U does not exist").
      TZ: ${TIMEZONE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - ./config/immich/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # # Infrastructure Services
  #
  # --- VPN ---
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION}
    container_name: tailscale
    restart: unless-stopped
    hostname: glimby-server
    network_mode: host # Allows Tailscale to see all local ports
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      # Was .config/tailscale/data — een verborgen map naast config/.
      - ./config/tailscale/data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  # --- Network-wide ad blocker ---
  pihole:
    container_name: pihole
    image: pihole/pihole:${PIHOLE_VERSION}
    restart: unless-stopped
    ports:
      # Disable port 53 on the host if you are running another DNS server there
      # sudo systemctl stop systemd-resolved
      # sudo systemctl disable systemd-resolved.service
      - "${SERVER_IP}:53:53/tcp"
      - "${SERVER_IP}:53:53/udp"
      - "8082:80/tcp"
    environment:
      TZ: ${TIMEZONE}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_misc_delay_startup: 10
    volumes:
      - './config/etc-pihole:/etc/pihole'
    networks:
      internal_media:
        aliases:
          - pihole

  # # ARR Stack Services
  #
  # --- Indexer Manager ---
  prowlarr:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION}
    container_name: prowlarr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696

 # --- Streaming service ---
  jellyfin:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_VERSION}
    container_name: jellyfin
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIA_DIR}:/data
    devices:
      - /dev/dri:/dev/dri      # CRITICAL: This enables hardware acceleration for the CPU
    ports:
      - 8096:8096

# --- Search Provider ---
  seerr:
    <<: *lsio-defaults # Use the reusable template
    image: ghcr.io/seerr-team/seerr:${SEERR_VERSION}
    init: true
    container_name: seerr
    volumes:
      - ./config/seerr:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://seerr:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

# --- Movies Manager ---
  radarr:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION}
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 7878:7878

# --- Shows Manager ---
  sonarr:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION}
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 8989:8989

# --- Quality Profile Manager ---
# https://dictionarry.dev/
  profilarr:
    <<: *lsio-defaults # Use the reusable template
    image: santiagosayshey/profilarr:${PROFILARR_VERSION} # or :beta
    container_name: profilarr
    ports:
      - "6868:6868"
    volumes:
      - ./config/profilarr:/config

# --- Subtitle Manager ---
  bazarr:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION}
    container_name: bazarr
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 6767:6767

# --- Download Client ---
  nzbget:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/nzbget:${NZBGET_VERSION}
    container_name: nzbget
    volumes:
      - ./config/nzbget:/config # Configuration files
      - ${MEDIA_DIR}:/data # The final media storage location
      - ./config/nzbget/intermediate:/scratch # The SSD (Fast) download folder for unpacking
    ports:
      - 6789:6789

# --- Ebook Manager ---
  calibre:
    <<: *lsio-defaults # Use the reusable template
    image: lscr.io/linuxserver/calibre:${CALIBRE_VERSION}
    container_name: calibre
    security_opt:
      - seccomp:unconfined #optional
    volumes:
      - ./config/calibre:/config
      - ${MEDIA_DIR}/Epubs:/epubs
    ports:
      - 8880:8080
      - 8181:8181
      - 8881:8081
    shm_size: "1gb"
    restart: unless-stopped

  # # System Services
  #
  # --- System Monitoring ---
  glances:
      image: nicolargo/glances:${GLANCES_VERSION}
      container_name: glances
      restart: unless-stopped
      pid: host # Required to see host processes/temp
      ports:
        - 61208:61208
      environment:
        - GLANCES_OPT=-w
      volumes:
      - /:/host:ro  # Hiermee ziet Glances je hele systeem als '/host'
      - /var/run/docker.sock:/var/run/docker.sock:ro
      network_mode: host
      devices:
        - /dev/dri:/dev/dri

# --- Dashboard ---
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION}
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/portainer:/data
    ports:
      - 9443:9443
      - 8000:8000

  # --- Speedtest Tracker ---
  # Default username/password admin@example.com/password
  speedtest-tracker:
    <<: *lsio-defaults # Use the reusable template
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:${SPEEDTEST_VERSION}
    ports:
      - 8080:80
      - 8443:443
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=http://${SERVER_IP}:8080
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */6 * * * # Runs every 6 hours
      - DISPLAY_TIMEZONE=${TIMEZONE}
    volumes:
      - ./config/speedtest-config:/config

  # --- Arr Stack Dashboard ---
  homepage:
    <<: *lsio-defaults # Use the reusable template
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION}
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - ./homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro # Allows it to show if containers are running
      - /sys/class/hwmon:/sys/class/hwmon:ro  # Optional: Allows it to show CPU temperature
    environment:
      # Een eigen environment: VERVANGT het blok uit *lsio-defaults, het voegt
      # niet samen. Zonder deze drie regels draaide homepage als root in UTC.
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - HOMEPAGE_ALLOWED_HOSTS=${SERVER_IP}:3000
      - HOMEPAGE_VAR_JELLYFIN_KEY=${HOMEPAGE_VAR_JELLYFIN_KEY}
      - HOMEPAGE_VAR_SEERR_KEY=${HOMEPAGE_VAR_SEERR_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_VAR_RADARR_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_VAR_SONARR_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_VAR_BAZARR_KEY}
      - HOMEPAGE_VAR_NZBGET_USER=${HOMEPAGE_VAR_NZBGET_USER}
      - HOMEPAGE_VAR_NZBGET_PASS=${HOMEPAGE_VAR_NZBGET_PASS}
      - HOMEPAGE_VAR_NAS_USER=${HOMEPAGE_VAR_NAS_USER}
      - HOMEPAGE_VAR_NAS_PASS=${HOMEPAGE_VAR_NAS_PASS}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_VAR_PROWLARR_KEY}
      - HOMEPAGE_VAR_SPEEDTEST_KEY=${HOMEPAGE_VAR_SPEEDTEST_KEY}
      - HOMEPAGE_VAR_PIHOLE_PASS=${HOMEPAGE_VAR_PIHOLE_PASS}
      - HOMEPAGE_VAR_NPM_USER=${HOMEPAGE_VAR_NPM_USER}
      - HOMEPAGE_VAR_NPM_PASS=${HOMEPAGE_VAR_NPM_PASS}
      - HOMEPAGE_VAR_IMMICH_KEY=${HOMEPAGE_VAR_IMMICH_KEY}